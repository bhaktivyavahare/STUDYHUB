# ─── Netlify configuration for StudyHub Frontend ──────────────────────────

[build]
  # Directory containing the frontend source relative to repo root
  base    = "frontend"

  # Vite build command
  command = "npm run build"

  # Vite outputs to frontend/dist
  publish = "dist"

# ─── SPA redirect ──────────────────────────────────────────────────────────
# React Router handles all client-side routes. Without this rule, refreshing
# any page other than "/" returns Netlify's default 404.
# The rule rewrites every request that does not match a real file to index.html.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ─── Security headers ──────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# ─── Cache static assets ───────────────────────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
